<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc"><title id="title">Area and project property cards — concept sheet</title><desc id="desc">Illustrative light Area card, dark Project card, typed clock settings editor, and narrow Project card. Figures are invented; this is not a shipped UI.</desc><rect width="1280" height="1100" fill="#eeeef1"/><style>text{font-family:DejaVu Sans,Arial,sans-serif} .mono{font-family:DejaVu Sans Mono,monospace}</style><text x="44" y="47" fill="#29313a" font-size="29" font-weight="700" >A quiet front door to the note</text><text x="44" y="77" fill="#626777" font-size="12" font-weight="400" letter-spacing="1.2">AREA + PROJECT  /  independent design concept  /  cdx</text><text x="44" y="116" fill="#5b616d" font-size="16" font-weight="400" >Identity, purpose, and context. Detailed properties stay one gesture away.</text><rect x="44" y="142" width="572" height="250" rx="12" fill="#fbfaff" stroke="#dcd8e9"/><rect x="66" y="165" width="42" height="42" rx="11" fill="#e9e4f5" stroke="none"/><circle cx="87" cy="186" r="11" fill="none" stroke="#51409a" stroke-width="1.7"/><circle cx="87" cy="186" r="3" fill="#51409a"/><text x="121" y="180" fill="#675880" font-size="11" font-weight="700" letter-spacing="1">AREA · Areas › Life</text><text x="121" y="214" fill="#29313a" font-size="29" font-weight="700" >Body</text><text x="458" y="179" fill="#645881" font-size="12" font-weight="400" >Edit properties  =+</text><text x="121" y="250" fill="#29313a" font-size="16" font-weight="400" >Keep enough energy and mobility</text><text x="121" y="275" fill="#29313a" font-size="16" font-weight="400" >for an active life.</text><text x="67" y="322" fill="#645d73" font-size="13" font-weight="400" >3 projects here</text><text x="373" y="322" fill="#645d73" font-size="13" font-weight="400" >Ready lane 3/5</text><path d="M44 348h572" stroke="#dedee5" fill="none"/><text x="66" y="375" fill="#6d657d" font-size="12" font-weight="400" >▸ Properties · 9</text><text x="465" y="375" fill="#6d657d" font-size="11" font-weight="400" >created Jun 11</text><rect x="642" y="142" width="594" height="250" rx="12" fill="#25232c" stroke="#45404f"/><rect x="664" y="165" width="42" height="42" rx="11" fill="#302a47" stroke="none"/><path d="M677 195V176m0 0h18l-5 7 5 5H677" stroke="#a99afa" stroke-width="1.7" fill="none" stroke-linejoin="round"/><text x="719" y="180" fill="#b6a5d5" font-size="11" font-weight="700" letter-spacing="1">PROJECT · Dev › Atlas</text><text x="719" y="214" fill="#f1edf7" font-size="28" font-weight="700" >Capture refresh</text><text x="1072" y="179" fill="#c5badc" font-size="12" font-weight="400" >Properties  =+</text><text x="665" y="249" fill="#b3a4c8" font-size="10" font-weight="700" letter-spacing="1.4">DONE WHEN</text><text x="665" y="274" fill="#eee8f6" font-size="15" font-weight="400" >Capture works without reaching for the mouse.</text><text x="665" y="309" fill="#c5b2ec" font-size="12" font-weight="400" >Open project task ↗</text><text x="1082" y="309" fill="#c1b9d0" font-size="12" font-weight="400" >Open</text><path d="M642 348h594" stroke="#45404f" fill="none"/><text x="664" y="375" fill="#b9adc9" font-size="12" font-weight="400" >▸ Properties · 8</text><text x="1083" y="375" fill="#b9adc9" font-size="11" font-weight="400" >created Nov 19</text><text x="44" y="422" fill="#656876" font-size="14" font-weight="400" >A shared visual family; the word and glyph identify the kind.</text><rect x="44" y="454" width="760" height="564" rx="12" fill="#fff" stroke="#d9d8e1"/><rect x="66" y="477" width="42" height="42" rx="11" fill="#e9e4f5" stroke="none"/><circle cx="87" cy="498" r="11" fill="none" stroke="#51409a" stroke-width="1.7"/><circle cx="87" cy="498" r="3" fill="#51409a"/><text x="122" y="490" fill="#6a5e80" font-size="11" font-weight="700" letter-spacing="1">AREA · PROPERTIES</text><text x="122" y="522" fill="#29313a" font-size="24" font-weight="700" >Body</text><text x="66" y="552" fill="#6c6b77" font-size="12" font-weight="400" >body.md · 9 properties</text><text x="697" y="493" fill="#66577d" font-size="12" font-weight="400" >/ filter</text><text x="66" y="588" fill="#787180" font-size="10" font-weight="700" letter-spacing="1.2">PROPERTIES · SELECTED ROWS</text><path d="M66 602h716" stroke="#dedee5" fill="none"/><text x="82" y="629" fill="#29313a" font-size="13" font-weight="400" class="mono">parent</text><text x="325" y="629" fill="#29313a" font-size="14" font-weight="400" >Life</text><text x="633" y="629" fill="#757180" font-size="12" font-weight="400" >Parent note</text><path d="M66 644h716" stroke="#dedee5" fill="none"/><text x="82" y="671" fill="#29313a" font-size="13" font-weight="400" class="mono">summary</text><text x="325" y="671" fill="#29313a" font-size="14" font-weight="400" >Keep enough energy…</text><text x="633" y="671" fill="#757180" font-size="12" font-weight="400" >Area summary</text><path d="M66 686h716" stroke="#dedee5" fill="none"/><rect x="66" y="697" width="716" height="42" rx="6" fill="#f0ebfa" stroke="none"/><text x="82" y="724" fill="#4e3a84" font-size="13" font-weight="400" class="mono">offclock_types</text><text x="325" y="724" fill="#4e3a84" font-size="14" font-weight="400" >MEET</text><text x="633" y="724" fill="#6b538a" font-size="12" font-weight="400" >Clock default</text><rect x="66" y="754" width="716" height="199" rx="8" fill="#faf8fe" stroke="#d8cee9"/><text x="84" y="782" fill="#29313a" font-size="16" font-weight="700" >Clock default</text><text x="84" y="809" fill="#6f6778" font-size="12" font-weight="400" >Inherit    /    On-clock    /    Off-clock</text><rect x="82" y="823" width="680" height="38" rx="6" fill="#eae3f5" stroke="none"/><text x="96" y="847" fill="#4e3a84" font-size="13" font-weight="600" >●  Selected types off-clock</text><text x="100" y="887" fill="#4e3a84" font-size="12" font-weight="400" >MEET  ×</text><text x="250" y="887" fill="#4e3a84" font-size="12" font-weight="400" >+ Add type</text><text x="84" y="920" fill="#696171" font-size="12" font-weight="400" >Other task types stay on-clock. Task tags can override this.</text><path d="M44 971h760" stroke="#dedee5" fill="none"/><text x="66" y="997" fill="#6e6876" font-size="12" font-weight="400" >Enter apply     Esc back     y YAML</text><text x="618" y="997" fill="#6e6876" font-size="11" font-weight="400" >Preview · 1 changed key</text><rect x="836" y="454" width="400" height="564" rx="12" fill="#fbfaff" stroke="#dcd8e9"/><rect x="858" y="478" width="42" height="42" rx="11" fill="#e9e4f5" stroke="none"/><path d="M871 508V489m0 0h18l-5 7 5 5H871" stroke="#51409a" stroke-width="1.7" fill="none" stroke-linejoin="round"/><text x="914" y="490" fill="#675880" font-size="11" font-weight="700" letter-spacing="1">PROJECT</text><text x="914" y="513" fill="#675880" font-size="12" font-weight="400" >Dev › Atlas</text><text x="858" y="560" fill="#29313a" font-size="25" font-weight="700" >Capture refresh</text><text x="858" y="600" fill="#645881" font-size="13" font-weight="400" >Edit properties  =+</text><path d="M858 623h356" stroke="#dedee5" fill="none"/><text x="858" y="654" fill="#786785" font-size="10" font-weight="700" letter-spacing="1.3">DONE WHEN</text><text x="858" y="685" fill="#29313a" font-size="16" font-weight="400" >A capture can be completed</text><text x="858" y="713" fill="#29313a" font-size="16" font-weight="400" >without reaching for…</text><text x="858" y="744" fill="#645881" font-size="12" font-weight="400" >Show full criterion</text><text x="858" y="782" fill="#645881" font-size="13" font-weight="400" >Open project task ↗</text><text x="858" y="832" fill="#6e6579" font-size="13" font-weight="400" >Open</text><text x="858" y="861" fill="#6e6579" font-size="13" font-weight="400" >Ready lane 2/5</text><path d="M836 911h400" stroke="#dedee5" fill="none"/><text x="858" y="940" fill="#6d657d" font-size="12" font-weight="400" >▸ Properties · 8</text><text x="858" y="976" fill="#6d657d" font-size="11" font-weight="400" >created Nov 19</text><text x="44" y="1053" fill="#646978" font-size="13" font-weight="400" >Illustrative data · Settings stage shown after selecting a field · No new required frontmatter</text><text x="44" y="1078" fill="#747784" font-size="12" font-weight="400" >Production must reuse kit/theme tokens and pass real-Obsidian contrast, focus, reflow, and failure tests.</text></svg>