<title id="title">Task requirements: comparison and proposed presentation</title>
<desc id="desc">Three identical outlines compare repeated hashes, a compact req text marker, and a diamond. Below, capture and close-card concepts show the req label and explain that requirements are met with their owner. Conceptual artwork, not application screenshots.</desc>
