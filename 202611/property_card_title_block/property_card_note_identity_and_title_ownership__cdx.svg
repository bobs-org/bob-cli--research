<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">One card family, three unmistakable note identities</title>
<desc id="desc">Design proposal, not a product screenshot. Album, Record, and Daily use distinct monochrome icons and explicit labels. Shared title typography and subtle area accents unify the cards. Light and dark samples and an empty daily header show the proposed behavior.</desc>
<rect width="1200" height="1020" fill="#f3f4f5"/>
<style>text{font-family:Inter,Arial,sans-serif} .title{font-size:27px;font-weight:650} .kind{font-size:12px;font-weight:700;letter-spacing:1.4px} .body{font-size:14px} .small{font-size:12px} .label{font-size:11px;font-weight:700;letter-spacing:1px}</style>
<text x="36" y="44" font-size="25" font-weight="650" fill="#1d2529">One family. Three clear identities.</text>
<text x="36" y="70" font-size="14" fill="#586167">Concept sketch · words + structural icons identify kind; area color keeps its existing meaning</text>
<text x="36" y="105" fill="#59636c" class="small" >LIGHT · same root hue on album and record</text>
