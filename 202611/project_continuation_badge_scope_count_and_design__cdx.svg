<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">Project continuation badge — proposed design</title>
<desc id="desc">A recruiter task link has a small skip-forward icon and the count four. A preview explains that completing the last planned task offers four project choices. Other panels show a dark theme, both dependency and continuation marks, and no mark while another project task remains planned. This design assumes the recommended broader project scope.</desc>
<defs>
  <g id="forward" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l9 7-9 7z"/><path d="M16 3v14"/></g>
  <g id="key" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="6" r="4"/><path d="M10 9L2 17M4 15l2 2M7 12l2 2"/></g>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#23314b" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="790" rx="18" fill="#f4f5f8"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <text x="44" y="44" font-size="12" font-weight="600" letter-spacing="1.6" fill="#5d6472">BOB · RESEARCH CONCEPT · CDX</text>
  <text x="44" y="82" font-size="30" font-weight="650" fill="#232735">The next choice, quietly in view.</text>
  <text x="44" y="111" font-size="15" fill="#5d6472">Project continuation · same symbol as Keep moving · explicit choice after completion</text>

  <rect x="32" y="140" width="1136" height="351" rx="14" fill="#fff" stroke="#e4e6ed"/>
  <text x="56" y="170" font-size="11" font-weight="650" letter-spacing="1.4" fill="#616978">EXAMPLE · PROPOSED PROJECT SCOPE</text>
  <rect x="56" y="190" width="17" height="17" rx="4" fill="none" stroke="#bfc4cf"/>
  <text x="85" y="204" font-size="16" fill="#373d49">() —</text>
  <rect x="125" y="186" width="63" height="24" rx="4" fill="#eeebf8"/>
  <text x="134" y="204" font-size="15" fill="#373d49">WRITE</text>
  <circle cx="202" cy="198" r="3.5" fill="none" stroke="#3b9c82"/>
  <text x="214" y="204" font-size="15" fill="#606570">job_email_recruiters · sase_blog</text>
  <path d="M70 222v40" stroke="#ebedf2"/>
  <circle cx="86" cy="239" r="2.5" fill="#b4b7c1"/>
  <text x="98" y="244" font-size="17" fill="#8151d4" text-decoration="underline">job_email_recruiters#^bryan-stephen-luzern-risk</text>
  <g transform="translate(532 229)" color="#36845b"><use href="#forward"/></g>
  <text x="556" y="244" font-size="14" fill="#535b67">4</text>

  <path d="M549 260v16" stroke="#b9c2cc" stroke-dasharray="3 3"/>
  <rect x="340" y="278" width="468" height="190" rx="10" fill="#fff" stroke="#dce1e8" filter="url(#shadow)"/>
  <g transform="translate(357 295)" color="#36845b"><use href="#forward"/></g>
  <text x="383" y="310" font-size="15" font-weight="600" fill="#2e3643">Keep job_email_recruiters moving · 4 choices</text>
  <text x="358" y="337" font-size="13" fill="#586171">Completing this last planned task offers 4 other tasks.</text>
  <text x="358" y="366" font-size="12" fill="#677180">Next</text><text x="404" y="366" font-size="13" fill="#374151">EcoGPT</text>
  <text x="358" y="388" font-size="12" fill="#677180">Next</text><text x="404" y="388" font-size="13" fill="#374151">Ray Lyles</text>
  <text x="358" y="410" font-size="12" fill="#677180">Next</text><text x="404" y="410" font-size="13" fill="#374151">Product engineer</text>
  <text x="358" y="433" font-size="12" fill="#596273">+1 more</text>
  <text x="358" y="454" font-size="11" fill="#596273">Ready in this project · not dependents</text>
  <text x="850" y="326" font-size="14" font-weight="600" fill="#303947">A forecast, not a button</text>
  <text x="850" y="351" font-size="13" fill="#596273">The usual Done gesture opens</text>
  <text x="850" y="371" font-size="13" fill="#596273">the existing picker.</text>
  <text x="850" y="403" font-size="13" fill="#596273">No task starts selected.</text>
  <text x="850" y="423" font-size="13" fill="#596273">Escape keeps the choice yours.</text>

  <rect x="32" y="511" width="550" height="116" rx="12" fill="#24262d"/>
  <text x="55" y="539" font-size="11" font-weight="600" letter-spacing="1.2" fill="#bcc2ce">DARK THEME · SAME VISUAL WEIGHT</text>
  <text x="55" y="577" font-size="16" fill="#bc98fa" text-decoration="underline">recruiters#^bryan-stephen-luzern-risk</text>
  <g transform="translate(381 562)" color="#8ac6a3"><use href="#forward"/></g>
  <text x="405" y="577" font-size="14" fill="#c6ccd6">4</text>
  <text x="55" y="606" font-size="12" fill="#bbc2cd">Theme tokens · no filled badge · no flashing updates</text>

  <rect x="600" y="511" width="568" height="116" rx="12" fill="#fff" stroke="#e4e6ed"/>
  <text x="623" y="539" font-size="11" font-weight="600" letter-spacing="1.2" fill="#616978">TWO DIFFERENT SIGNALS · SYNTHETIC EXAMPLE</text>
  <text x="623" y="577" font-size="16" fill="#8151d4" text-decoration="underline">project#^current-task</text>
  <g transform="translate(819 562)" color="#916b16"><use href="#key"/></g>
  <text x="844" y="577" font-size="14" fill="#535b67">1</text>
  <g transform="translate(875 562)" color="#36845b"><use href="#forward"/></g>
  <text x="899" y="577" font-size="14" fill="#535b67">4</text>
  <text x="623" y="606" font-size="12" fill="#596273">Frees dependents · then project choices · never a summed total</text>

  <rect x="32" y="647" width="1136" height="99" rx="12" fill="#fff" stroke="#e4e6ed"/>
  <text x="55" y="675" font-size="11" font-weight="600" letter-spacing="1.2" fill="#616978">ANOTHER PROJECT TASK REMAINS PLANNED</text>
  <text x="55" y="710" font-size="16" fill="#8151d4" text-decoration="underline">project#^current-task</text>
  <text x="300" y="710" font-size="13" fill="#596273">No continuation mark: completing this task alone does not open these choices yet.</text>
  <text x="44" y="774" font-size="11" fill="#616978">Concept only. The current recruiter project is top-level; the proposed offer-scope change is required for the four-choice forecast.</text>
</g>
</svg>