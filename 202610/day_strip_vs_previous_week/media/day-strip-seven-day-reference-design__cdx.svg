<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920" role="img" aria-labelledby="title desc">
<title id="title">Day strip: a quiet reference beneath each number</title>
<desc id="desc">Design study with synthetic values. Completed days use neutral direction marks beside seven-day averages. Today displays the same averages without direction marks. An incomplete history reads history 5/7 instead of inventing a comparison.</desc>
<rect width="1080" height="920" fill="#f3f1ec"/>
<style>text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; } .value { font-size:25px; font-weight:600; font-variant-numeric:tabular-nums; } .label { font-size:10px; font-weight:600; letter-spacing:1px; } .ref { font-size:12px; font-variant-numeric:tabular-nums; } .caption {font-size:14px;} </style>
